services:
  postgres:
    image: postgres:16-alpine
    container_name: light-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: light_delivery
      POSTGRES_USER: light_delivery
      POSTGRES_PASSWORD: light_delivery_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U light_delivery -d light_delivery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: light-delivery-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://light_delivery:light_delivery_password@postgres:5432/light_delivery?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: light-delivery-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://light_delivery:light_delivery_password@postgres:5432/light_delivery?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: change-this-access-secret
      JWT_REFRESH_SECRET: change-this-refresh-secret
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
